<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>SH1DEN'S · Phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://sh1den-bar-default-rtdb.europe-west1.firebasedatabase.app" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=VT323&family=Limelight&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080a; --body: #16171b; --body2: #0e0f12; --lcd: #0b1410; --lcd2: #0f1c16; --ink: #b8f0c8; --dim: #6f9a80; --line: #24402f;
  --gold: #e2b467; --red: #f0806e; --blue: #8fd0ff;
  --px: 'VT323', ui-monospace, monospace; --deco: 'Limelight', Georgia, serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--px); font-size: 20px; -webkit-text-size-adjust: 100%; }
body { display: flex; justify-content: center; align-items: center; }
button, input, select, textarea { font: inherit; color: inherit; }
/* the handset: fills a real phone, sits on the desk as a device on a computer */
.phone { width: 100%; height: 100%; display: flex; flex-direction: column; background: linear-gradient(180deg, var(--body), var(--body2)); }
@media (min-width: 560px) {
  .phone { width: 400px; height: min(820px, calc(100vh - 40px)); border-radius: 36px; padding: 14px 12px 18px; border: 2px solid #2a2b31;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 2px 0 rgba(255,255,255,0.05); }
}
.earpiece { height: 22px; display: flex; justify-content: center; align-items: center; gap: 10px; padding-top: env(safe-area-inset-top, 0); }
.earpiece i { width: 54px; height: 5px; border-radius: 3px; background: #050506; box-shadow: inset 0 1px 2px #000; }
.brand { font-family: var(--deco); color: var(--gold); font-size: 13px; letter-spacing: 0.25em; text-align: center; margin: 2px 0 6px; text-shadow: 0 0 8px rgba(226,180,103,0.4); }
.screen { flex: 1; min-height: 0; margin: 0 6px; border-radius: 10px; background: radial-gradient(ellipse at 50% 30%, var(--lcd2), var(--lcd)); border: 3px solid #050606;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.7), 0 0 0 1px #2c2e33; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 3px); }
.sbar { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px; font-size: 16px; color: var(--dim); border-bottom: 1px solid var(--line); }
.sig { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; } .sig i { width: 3px; background: var(--ink); } .sig i:nth-child(1){height:4px}.sig i:nth-child(2){height:7px}.sig i:nth-child(3){height:10px}.sig i:nth-child(4){height:12px}
.sig.off i { background: var(--line); }
.bat { display: inline-block; width: 22px; height: 11px; border: 2px solid var(--ink); position: relative; vertical-align: -1px; } .bat::before { content: ''; position: absolute; inset: 1px 6px 1px 1px; background: var(--ink); } .bat::after { content: ''; position: absolute; right: -5px; top: 2px; width: 3px; height: 3px; background: var(--ink); }
.title { padding: 6px 10px 4px; font-size: 26px; color: var(--gold); display: flex; justify-content: space-between; align-items: baseline; }
.title small { font-size: 16px; color: var(--dim); }
.view { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 10px 12px; -webkit-overflow-scrolling: touch; }
.softkeys { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding: 10px 8px 4px; }
.key { height: 44px; border-radius: 14px; border: 1px solid #2c2e34; background: linear-gradient(180deg, #24252b, #17181c); color: #d8d4cc; font-size: 20px; box-shadow: 0 3px 0 #08090a; }
.key:active { transform: translateY(2px); box-shadow: 0 1px 0 #08090a; }
.key.c { background: linear-gradient(180deg, #3a2f1c, #261e10); color: var(--gold); }
p { margin: 6px 0; line-height: 1.15; }
.dim { color: var(--dim); } .gold { color: var(--gold); } .red { color: var(--red); } .blue { color: var(--blue); }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 6px; }
.app { aspect-ratio: 1; border: 1px solid var(--line); background: rgba(184,240,200,0.04); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 18px; position: relative; }
.app b { font-size: 30px; line-height: 1; font-weight: 400; } .app:active { background: rgba(184,240,200,0.12); }
.app .dot { position: absolute; top: 6px; right: 8px; width: 8px; height: 8px; background: var(--gold); box-shadow: 0 0 6px var(--gold); }
.card { border: 1px solid var(--line); padding: 8px 10px; margin: 8px 0; background: rgba(184,240,200,0.03); }
.card h3 { margin: 0 0 4px; font-weight: 400; font-size: 22px; color: var(--gold); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--ink); background: transparent; padding: 6px 12px; min-height: 40px; color: var(--ink); }
.btn.p { background: var(--ink); color: var(--lcd); } .btn:disabled { opacity: 0.4; } .btn.wide { width: 100%; }
.btn.g { background: #f4f1ea; color: #222; border-color: #f4f1ea; }
input, select, textarea { width: 100%; background: #050a07; border: 1px solid var(--line); padding: 8px; color: var(--ink); font-size: 20px; }
label { display: block; margin: 8px 0 2px; color: var(--dim); font-size: 16px; }
.list { list-style: none; margin: 0; padding: 0; } .list li { padding: 7px 0; border-bottom: 1px dashed var(--line); line-height: 1.1; }
.list li .t { color: var(--dim); font-size: 15px; }
.msg { margin: 0; padding: 4px 0; line-height: 1.1; word-wrap: break-word; } .msg b { font-weight: 400; }
.compose { display: flex; gap: 6px; padding-top: 6px; } .compose input { flex: 1; }
.bar { height: 14px; border: 1px solid var(--ink); padding: 2px; } .bar i { display: block; height: 100%; background: var(--ink); width: 0; transition: width 0.4s steps(10); }
.task { border: 1px dashed var(--gold); padding: 10px; margin: 8px 0; color: var(--gold); animation: blink 1s steps(2) 3; }
@keyframes blink { 50% { border-color: transparent; } }
.ph { display: inline-block; width: 6px; height: 10px; border: 2px solid var(--blue); position: relative; margin-left: 4px; vertical-align: -1px; } .ph::after { content: ''; position: absolute; left: 1px; right: 1px; bottom: 1px; height: 2px; background: var(--blue); }
.on { color: var(--ink); } .off { color: var(--dim); }
.tabs { display: flex; gap: 6px; margin: 4px 0 6px; } .tabs button { flex: 1; border: 1px solid var(--line); background: transparent; padding: 4px; color: var(--dim); } .tabs button.sel { border-color: var(--ink); color: var(--ink); }
.toast { position: absolute; left: 10px; right: 10px; bottom: 10px; background: var(--ink); color: var(--lcd); padding: 8px 10px; z-index: 3; }
a { color: var(--blue); }
.center { text-align: center; }
.big { font-size: 34px; color: var(--gold); }
</style>
</head>
<body>
<div class="phone">
  <div class="earpiece"><i></i></div>
  <div class="brand">SH1DEN'S</div>
  <div class="screen">
    <div class="sbar"><span class="sig off" id="sig"><i></i><i></i><i></i><i></i></span><span id="clock">--:--</span><span><span id="who" class="dim"></span> <span class="bat"></span></span></div>
    <div class="title"><span id="ttl">Starting…</span><small id="sub"></small></div>
    <div class="view" id="view"><p class="dim">Dialling in…</p></div>
  </div>
  <div class="softkeys">
    <button class="key" id="kL" type="button">Back</button>
    <button class="key c" id="kC" type="button">Menu</button>
    <button class="key" id="kR" type="button">Me</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js?v=67"></script>
<script>
/* SH1DEN'S on the phone: no 3D, just chat, who's in, the TV and your friends.
   Same accounts and database as the bar. While you're here, your character shows in the bar with a phone by its name. */
(function () {
'use strict';
const cfg = window.BAR_CONFIG || {};
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const fmt = (n) => (+n || 0).toLocaleString();
let db = null, TS = null, offset = 0, me = null, uid = null, myName = '', isAdmin = false;
let coins = 0, online = {}, chars = {}, friends = {}, chat = [], news = [], gifts = [], tvNow = null, tvQueue = [];
let screen = 'home', backTo = [], lastSend = 0;
const now = () => Date.now() + offset;
const ago = (t) => { const s = Math.max(0, (now() - t) / 1000); return s < 60 ? 'now' : s < 3600 ? Math.floor(s / 60) + 'm' : s < 86400 ? Math.floor(s / 3600) + 'h' : Math.floor(s / 86400) + 'd'; };

function toast(t) { const o = document.createElement('div'); o.className = 'toast'; o.textContent = t; document.querySelector('.screen').appendChild(o); setTimeout(() => o.remove(), 2600); }
setInterval(() => { const d = new Date(); $('clock').textContent = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }, 1000);

// ---------------------------------------------------------------- screens
const BRAVE_TIP = 'Full bar runs smoothest in Safari. On Brave, tap the lion and turn Shields off for this site.';
const APPS = [
  ['chat', '☏', 'Chat'], ['who', '☻', "Who's in"], ['friends', '☺', 'Friends'],
  ['tv', '▶', 'The TV'], ['news', '✉', 'News'], ['wallet', '¤', 'Wallet'],
  ['me', '◉', 'Me'], ['pc', '▣', 'Full bar']
];
function go(s, push) { if (push !== false && s !== screen) backTo.push(screen); screen = s; render(); $('view').scrollTop = 0; }
$('kL').onclick = () => { if (backTo.length) { screen = backTo.pop(); render(); } };
$('kC').onclick = () => { backTo = []; go(me ? 'home' : 'login', false); };
$('kR').onclick = () => go(me ? 'me' : 'login');

function render() {
  const v = $('view');
  const T = (t, s) => { $('ttl').textContent = t; $('sub').textContent = s || ''; };
  if (!me) { screen = 'login'; }
  if (screen === 'login') { T('Sign in'); v.innerHTML = loginHTML(); wireLogin(); return; }
  if (screen === 'home') {
    T(myName || 'Guest', fmt(coins) + ' 🪙');
    v.innerHTML =
      '<p class="dim">' + Object.keys(online).length + ' in the bar right now</p>' +
      (tvNow ? '<p>▶ <span class="gold">' + esc(tvNow.title || 'a video') + '</span> <span class="dim">on the TV</span></p>' : '') +
      (news[0] ? '<p>✉ <span class="gold">' + esc(news[0].text) + '</span></p>' : '') +
      '<div class="grid">' + APPS.map(([k, ic, n]) => '<button class="app" type="button" data-go="' + k + '"><b>' + ic + '</b>' + n + (dotFor(k) ? '<i class="dot"></i>' : '') + '</button>').join('') + '</div>' +
      '<p class="dim center" style="margin-top:10px;font-size:16px">' + BRAVE_TIP + '</p>';
    for (const b of v.querySelectorAll('[data-go]')) b.onclick = () => (b.dataset.go === 'pc' ? (location.href = 'index.html?full') : go(b.dataset.go));
    return;
  }
  if (screen === 'who') { T("Who's in", Object.keys(online).length + ' here'); v.innerHTML = whoHTML(); wireWho(); return; }
  if (screen === 'tv') { T('The TV'); v.innerHTML = tvHTML(); return; }
  if (screen === 'news') { T('News'); v.innerHTML = newsHTML(); wireNews(); return; }
  if (screen === 'chat') { T('Chat', 'the bar'); v.innerHTML = chatHTML(); wireChat(); return; }
  if (screen === 'friends') { T('Friends'); v.innerHTML = friendsHTML(); wireFriends(); return; }
  if (screen === 'wallet') { T('Wallet'); v.innerHTML = walletHTML(); try { const a = JSON.parse(localStorage.getItem('sh1den-phone-gifts') || '[]'); for (const g of gifts) if (!a.includes(g.id)) a.push(g.id); localStorage.setItem('sh1den-phone-gifts', JSON.stringify(a.slice(-200))); } catch (e) { } return; }
  if (screen === 'me') { T('Me'); v.innerHTML = meHTML(); wireMe(); return; }
}
function dotFor(k) {
  if (k === 'wallet') return gifts.some((g) => !seenGift(g.id));
  if (k === 'news') return news[0] && news[0].t > +(localStorage.getItem('sh1den-phone-news') || 0);
  return false;
}

// ---------------------------------------------------------------- sign in (same accounts as the PC game)
function loginHTML() {
  return '<p>Log in with the account you made in the bar on your computer (Me → Account).</p>' +
    '<button class="btn g wide" type="button" id="lgG"><b style="color:#3a6fd8;font-family:Arial">G</b> Log in with Google</button>' +
    '<label>Email</label><input id="lgE" type="email" autocomplete="email">' +
    '<label>Password</label><input id="lgP" type="password" autocomplete="current-password">' +
    '<div class="row" style="margin-top:10px"><button class="btn p" type="button" id="lgGo">Log in</button><button class="btn" type="button" id="lgF">Forgot?</button></div>' +
    '<p class="dim" style="margin-top:14px">No account? Open the bar on a computer, make your character, then Me → Account → Make an account.</p>' +
    '<p><a href="#" id="lgGuest">Look around as a guest</a> · <a href="index.html?full">Full 3D bar</a></p><p id="lgM" class="red"></p>';
}
function nice(e) { const c = (e && e.code) || ''; return /wrong-password|invalid-credential|invalid-login|user-not-found/.test(c) ? 'Wrong email or password.' : /too-many/.test(c) ? 'Too many tries. Wait a minute.' : /operation-not-allowed/.test(c) ? 'Login type not switched on yet (host: enable it in Firebase).' : /unauthorized-domain/.test(c) ? 'Google login not allowed on this site yet (host: add the domain in Firebase).' : 'Something went wrong (' + (c || 'error') + ').'; }
function wireLogin() {
  const a = firebase.auth();
  $('lgGo').onclick = async () => { $('lgM').textContent = ''; try { await a.signInWithEmailAndPassword($('lgE').value.trim(), $('lgP').value); } catch (e) { $('lgM').textContent = nice(e); } };
  $('lgP').onkeydown = (e) => { if (e.key === 'Enter') $('lgGo').click(); };
  $('lgF').onclick = async () => { const em = $('lgE').value.trim(); if (!em) { $('lgM').textContent = 'Type your email first.'; return; } try { await a.sendPasswordResetEmail(em); toast('Reset link sent. Check your inbox.'); } catch (e) { $('lgM').textContent = nice(e); } };
  $('lgG').onclick = async () => { const p = new firebase.auth.GoogleAuthProvider(); try { await a.signInWithPopup(p); } catch (e) { if (/popup-blocked|not-supported/.test(e.code || '')) { try { sessionStorage.setItem('sh1den-redirect', '1'); } catch (er) { } a.signInWithRedirect(p); } else $('lgM').textContent = nice(e); } };
  $('lgGuest').onclick = (e) => { e.preventDefault(); a.signInAnonymously().catch((er) => { $('lgM').textContent = nice(er); }); };
}

// ---------------------------------------------------------------- who's in the bar right now
const seenGift = (id) => { try { return (JSON.parse(localStorage.getItem('sh1den-phone-gifts') || '[]')).includes(id); } catch (e) { return false; } };
function whoHTML() {
  const L = Object.keys(online).map((u) => ({ uid: u, name: (chars[u] && chars[u].name) || '…', p: online[u] })).filter((x) => x.name !== '…');
  L.sort((a, b) => a.name.localeCompare(b.name));
  return '<ul class="list">' + (L.length ? L.map((x) => '<li>● ' + esc(x.name) + (x.p && x.p.m ? '<span class="ph"></span>' : '') + (friends[x.uid] ? ' <span class="gold">★</span>' : '') +
    '<br><span class="t">' + (x.p && x.p.m ? 'on the phone' : esc(roomOf(x.p && x.p.s))) + '</span>' + (x.uid !== uid && !friends[x.uid] ? ' <button class="btn" type="button" data-add="' + esc(x.uid) + '">Add friend</button>' : '') + '</li>').join('') : '<li class="dim">Nobody\'s in right now.</li>') + '</ul>';
}
function wireWho() { for (const b of document.querySelectorAll('[data-add]')) b.onclick = () => db.ref('friends/' + uid + '/' + b.dataset.add).set(true).then(() => toast('Added.')).catch(() => toast("Couldn't add.")); }
const ROOM_WORDS = [['vip', 'VIP lounge'], ['pool', 'pool room'], ['card', 'poker room'], ['tv', 'TV room'], ['dance', 'dance floor'], ['swim', 'the pool'], ['lounge', 'lounge'], ['street', 'outside'], ['alley', 'the alley'], ['base', 'the basement'], ['room', 'the hotel'], ['bar', 'at the bar']];
function roomOf(s) { s = String(s || ''); if (!s) return 'hanging around'; for (const [k, n] of ROOM_WORDS) if (s.indexOf(k) >= 0) return n; return 'hanging around'; }

// ---------------------------------------------------------------- the TV: what everyone's watching
function tvHTML() {
  let h = tvNow ? '<div class="card"><h3>Now playing</h3><p>' + esc(tvNow.title || 'a video') + '</p><p class="dim">put on by ' + esc(tvNow.name || 'someone') + '</p><p><a href="https://www.youtube.com/watch?v=' + encodeURIComponent(tvNow.v) + '" target="_blank" rel="noopener">Watch on YouTube</a></p></div>' : '<p class="dim">The TV is off.</p>';
  h += '<div class="card"><h3>Up next</h3><ul class="list">' + (tvQueue.length ? tvQueue.slice(0, 10).map((q) => '<li>' + esc(q.title || 'a video') + ' <span class="t">' + esc(q.name || '') + '</span></li>').join('') : '<li class="dim">Nothing queued.</li>') + '</ul></div>';
  return h + '<p class="dim">Add videos from the full bar on a computer.</p>';
}

// ---------------------------------------------------------------- news: headlines from the hosts, plus the town wire (who got hired where)
function newsHTML() {
  try { localStorage.setItem('sh1den-phone-news', String(now())); } catch (e) { }
  let h = '';
  if (isAdmin) h += '<div class="compose"><input id="nT" maxlength="200" placeholder="Post a headline (hosts)"><button class="btn p" type="button" id="nGo">Post</button></div>';
  h += '<ul class="list">' + (news.length ? news.slice(0, 25).map((n) => '<li><span class="gold">' + esc(n.text) + '</span><br><span class="t">' + esc(n.by || 'the hosts') + ' · ' + ago(n.t) + '</span></li>').join('') : '<li class="dim">No headlines yet.</li>') + '</ul>';
  return h;
}
function wireNews() {
  if ($('nGo')) $('nGo').onclick = () => { const t = $('nT').value.trim(); if (!t) return; db.ref('news').push({ text: t.slice(0, 200), by: myName || 'host', t: TS }).then(() => toast('Posted.')).catch(() => toast("Couldn't post.")); };
}

// ---------------------------------------------------------------- chat: the same town chat as the game
function chatHTML() {
  let h = '<div id="chatList">' + chat.slice(-40).map((m) => '<p class="msg"><b class="gold">' + esc(m.name) + '</b>' + (online[m.uid] && online[m.uid].m ? '<span class="ph"></span>' : '') + ' ' + esc(m.text) + '</p>').join('') + '</div>';
  h += myName ? '<div class="compose"><input id="cT" maxlength="200" placeholder="Say something" enterkeyhint="send"><button class="btn p" type="button" id="cGo">Send</button></div>' : '<p class="dim">Make your character in the bar on a computer to talk here.</p>';
  return h;
}
function wireChat() {
  const v = $('view'); v.scrollTop = v.scrollHeight;
  if (!$('cGo')) return;
  const send = () => {
    const t = $('cT').value.trim(); if (!t) return;
    const wait = lastSend + 5200 - Date.now(); if (wait > 0 && !isAdmin) { toast('Slow down a sec (' + Math.ceil(wait / 1000) + 's).'); return; }
    const key = db.ref('chat').push().key, upd = {};
    upd['chat/' + key] = { uid, name: myName, text: t.slice(0, 200), t: TS };
    upd['last/' + uid] = TS;
    lastSend = Date.now();
    db.ref().update(upd).then(() => { $('cT').value = ''; }).catch(() => toast("Couldn't send."));
  };
  $('cGo').onclick = send; $('cT').onkeydown = (e) => { if (e.key === 'Enter') send(); };
  if (window._chatDraft) { $('cT').value = window._chatDraft; window._chatDraft = ''; $('cT').focus(); }
}

// ---------------------------------------------------------------- friends
function friendsHTML() {
  const L = Object.keys(friends).map((f) => ({ uid: f, name: (chars[f] && chars[f].name) || '?', on: online[f] }));
  L.sort((a, b) => (!!b.on - !!a.on) || a.name.localeCompare(b.name));
  let h = '<div class="compose"><input id="fN" maxlength="25" placeholder="Add by name"><button class="btn p" type="button" id="fGo">Add</button></div><ul class="list">';
  h += L.length ? L.map((f) => '<li><span class="' + (f.on ? 'on' : 'off') + '">' + (f.on ? '● ' : '○ ') + esc(f.name) + '</span>' + (f.on && f.on.m ? '<span class="ph"></span>' : '') +
    '<br><span class="t">' + (f.on ? (f.on.m ? 'on the phone' : 'in the bar') : 'away') + '' + '</span> ' +
    '<button class="btn" type="button" data-hi="' + esc(f.name) + '">Say hi</button> <button class="btn" type="button" data-rm="' + esc(f.uid) + '">✕</button></li>').join('') : '<li class="dim">No friends added yet.</li>';
  return h + '</ul>';
}
function wireFriends() {
  $('fGo').onclick = async () => {
    const n = $('fN').value.trim().toLowerCase(); if (!n) return;
    const s = await db.ref('names/' + n).once('value').catch(() => null);
    const f = s && s.val();
    if (!f) { toast('Nobody called that.'); return; }
    if (f === uid) { toast("That's you."); return; }
    db.ref('friends/' + uid + '/' + f).set(true).then(() => toast('Added.')).catch(() => toast("Couldn't add."));
  };
  for (const b of document.querySelectorAll('[data-rm]')) b.onclick = () => db.ref('friends/' + uid + '/' + b.dataset.rm).remove();
  for (const b of document.querySelectorAll('[data-hi]')) b.onclick = () => { window._chatDraft = '@' + b.dataset.hi + ' '; go('chat'); };
}

// ---------------------------------------------------------------- wallet & me
function walletHTML() {
  return '<p class="center big">' + fmt(coins) + ' 🪙</p><p class="center dim">sh1den coins</p>' +
    '<div class="card"><h3>Gifts</h3><ul class="list">' + (gifts.slice().sort((a, b) => b.t - a.t).slice(0, 10).map((g) => '<li>' + (seenGift(g.id) ? '✓ ' : '★ ') + '+' + fmt(g.amt) + ' from ' + esc((chars[g.from] && chars[g.from].name) || 'someone') + ' <span class="t">' + ago(g.t) + '</span></li>').join('') || '<li class="dim">None yet.</li>') + '</ul></div>' +
    '<p class="dim">Spend coins in the bar on a computer.</p>';
}
function meHTML() {
  const g = me.isAnonymous;
  return '<div class="card"><h3>' + esc(myName || 'No character yet') + '</h3>' +
    '<p class="dim">' + (g ? 'Guest on this phone' : esc(me.email || 'signed in')) + '</p></div>' +
    '<p>People in the bar see a <span class="ph"></span> next to your name while you\'re here.</p>' +
    '<p><a href="index.html?full">Open the full 3D bar</a></p><p class="dim">' + BRAVE_TIP + '</p>' +
    '<p><button class="btn" type="button" id="meOut">Log out</button></p>';
}
function wireMe() { $('meOut').onclick = () => { try { db.ref('presence/' + uid).remove(); } catch (e) { } firebase.auth().signOut(); }; }

// ---------------------------------------------------------------- connecting
const live = [];
function listen(ref, ev, fn) { ref.on(ev, fn); live.push([ref, ev, fn]); }
function stopAll() { for (const [r, e, f] of live.splice(0)) r.off(e, f); }
function rerender() { if (screen !== 'login' && document.activeElement && /INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) return; render(); }
function start() {
  if (!(cfg.firebase && window.firebase)) { $('view').innerHTML = '<p class="red">Can\'t reach the game right now.</p>'; return; }
  try { firebase.initializeApp(cfg.firebase); } catch (e) { }
  db = firebase.database(); TS = firebase.database.ServerValue.TIMESTAMP;
  db.ref('.info/serverTimeOffset').on('value', (s) => { offset = s.val() || 0; });
  db.ref('.info/connected').on('value', (s) => { $('sig').classList.toggle('off', !s.val()); });
  // only coming back from a Google redirect needs this (it pulls in a heavy Google script, so skip it otherwise)
  try { if (sessionStorage.getItem('sh1den-redirect')) { sessionStorage.removeItem('sh1den-redirect'); firebase.auth().getRedirectResult().catch(() => { }); } } catch (e) { }
  firebase.auth().onAuthStateChanged((u) => {
    stopAll(); me = u; uid = u ? u.uid : null;
    $('who').textContent = u ? (u.isAnonymous ? 'guest' : '') : '';
    if (!u) { screen = 'login'; backTo = []; render(); return; }
    screen = 'home'; backTo = []; render();
    listen(db.ref('chars/' + uid), 'value', (s) => { const c = s.val(); myName = (c && c.name) || ''; rerender(); goOnline(); });
    listen(db.ref('admins/' + uid), 'value', (s) => { isAdmin = s.exists(); });
    listen(db.ref('coins/' + uid + '/n'), 'value', (s) => { coins = +s.val() || 0; rerender(); });
    listen(db.ref('presence'), 'value', (s) => { online = s.val() || {}; for (const k in online) if (online[k] === true) online[k] = {}; if (screen === 'friends' || screen === 'home' || screen === 'who') rerender(); });
    listen(db.ref('tv/current'), 'value', (s) => { const v = s.val(); tvNow = v && v.v ? v : null; if (screen === 'tv' || screen === 'home') rerender(); });
    listen(db.ref('tv/queue').orderByKey().limitToFirst(15), 'value', (s) => { tvQueue = []; s.forEach((c) => { const v = c.val(); if (v && v.v) tvQueue.push(v); }); if (screen === 'tv') rerender(); });
    listen(db.ref('chars'), 'value', (s) => { chars = s.val() || {}; });
    listen(db.ref('friends/' + uid), 'value', (s) => { friends = s.val() || {}; if (screen === 'friends') rerender(); });
    listen(db.ref('chat').limitToLast(40), 'value', (s) => { chat = []; s.forEach((c) => { chat.push(c.val()); }); if (screen === 'chat') { const inp = $('cT'); const keep = inp ? inp.value : ''; render(); if ($('cT')) $('cT').value = keep; } });
    listen(db.ref('news').limitToLast(25), 'value', (s) => { news = []; s.forEach((c) => { news.unshift(Object.assign({ id: c.key }, c.val())); }); rerender(); });
    listen(db.ref('gifts').orderByChild('to').equalTo(uid).limitToLast(30), 'value', (s) => { gifts = []; s.forEach((c) => { gifts.push(Object.assign({ id: c.key }, c.val())); }); rerender(); });
  });
}
// your character shows up in town with the phone icon while this page is open
let presRef = null;
function goOnline() {
  if (!uid || !myName) return;
  presRef = db.ref('presence/' + uid);
  presRef.onDisconnect().remove();
  presRef.set({ s: '', d: '', t: TS, m: true }).catch(() => presRef.set(true).catch(() => { }));
}
setInterval(() => { if (presRef && myName) presRef.set({ s: '', d: '', t: TS, m: true }).catch(() => { }); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && presRef && myName) presRef.set({ s: '', d: '', t: TS, m: true }).catch(() => { }); });
start();
})();
</script>
</body>
</html>
